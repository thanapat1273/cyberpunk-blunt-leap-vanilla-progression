# Blunt Leap: game data (TweakXL).
#
# Nothing here changes a vanilla record. Every record is new and lives under
# "BluntLeap.". The scripts in r6/scripts/BluntLeap apply these to the player.

# --- The leap ability ------------------------------------------------------
# Same structure as the vanilla blade-leap perk (Flash and Thunderclap,
# NewPerks.Reflexes_Inbetween_Right_2), with the blunt-weapon condition.
# The game's leap code only asks for the CanMeleeLeap flag; it has no
# weapon-type check of its own.

BluntLeap.LeapStats:
  $type: StatModifierGroup
  statModifiers:
    - $type: ConstantStatModifier
      statType: BaseStats.CanMeleeLeap
      modifierType: Additive
      value: 1.0

BluntLeap.LeapEffector:
  $type: ApplyStatGroupEffector
  effectorClassName: ApplyStatGroupEffector
  prereqRecord: Prereqs.BluntWeaponHeldPrereq
  removeWithEffector: true
  statGroup: BluntLeap.LeapStats

BluntLeap.LeapAbility:
  $type: GameplayLogicPackage
  stackable: false
  effectors:
    - BluntLeap.LeapEffector

# --- Leaping while in the air (its own package, so a setting can drop it) ---

BluntLeap.AirLeapStats:
  $type: StatModifierGroup
  statModifiers:
    - $type: ConstantStatModifier
      statType: BaseStats.CanMeleeLeapInAir
      modifierType: Additive
      value: 1.0

BluntLeap.AirLeapEffector:
  $type: ApplyStatGroupEffector
  effectorClassName: ApplyStatGroupEffector
  prereqRecord: Prereqs.BluntWeaponHeldPrereq
  removeWithEffector: true
  statGroup: BluntLeap.AirLeapStats

BluntLeap.AirLeapAbility:
  $type: GameplayLogicPackage
  stackable: false
  effectors:
    - BluntLeap.AirLeapEffector

# --- Damage bonus by leap distance -----------------------------------------
# The game's own effector class. maxPercentMult is rewritten from the settings
# before the package is applied (see BluntLeapSystem.Refresh).

BluntLeap.DistanceBonusPrereq:
  $type: MultiPrereq
  prereqClassName: gameMultiPrereq
  aggregationType: AND
  nestedPrereqs:
    - Prereqs.BluntWeaponHeldPrereq
    - Perks.IsHitStrongAttack

BluntLeap.DistanceBonusEffector:
  $type: Effector
  effectorClassName: ModifyDamageWithLeapedDistance
  prereqRecord: BluntLeap.DistanceBonusPrereq
  operationType: Multiply
  maxPercentMult: 1.5
  minDistance: 0.0
  maxDistance: 20.0

BluntLeap.DistanceBonus:
  $type: GameplayLogicPackage
  stackable: false
  effectors:
    - BluntLeap.DistanceBonusEffector

# --- Charge pool for blunt weapons that have none ---------------------------
# Same pool type as the chainsword's (WeaponCharge), so the game's melee
# crosshair bar, IsCharged() and the charged-damage rule all work unchanged.
# It is a separate record: BaseStatPools.TechMeleeCharge is not touched.
# The scripts empty it after each attack; it has no decay of its own.

BluntLeap.ChargePool:
  $type: StatPool
  enumName: WeaponCharge
  stat: BaseStats.Charge
  initialValue: 0.0
  savable: false
  # Fill and decay as the game's own weapon charge pool has them
  # (BaseStatPools.WeaponChargeRegen / WeaponChargeDecay): the fill is off
  # until a hold starts it, the decay is off, neither has a start delay.
  # Until 2026-11-24 the decay was on, with a 1.5 s delay restarted by every
  # change. The game turns the decay off when a hold starts and never back
  # on, so it only ever acted on the first hold after a load, and there its
  # delay held the fill back: the timing log showed the first charge
  # growing 1.49 s after the hold started, every later one at once.
  regen:
    $type: PoolValueModifier
    enabled: false
    rangeBegin: 0.0
    rangeEnd: 100.0
    startDelay: 0.0
    valuePerSec: 150.0
    delayOnChange: false
  decay:
    $type: PoolValueModifier
    enabled: false
    rangeBegin: 0.0
    rangeEnd: 100.0
    startDelay: 0.0
    valuePerSec: 300.0
    delayOnChange: false

# --- Stronger leap: what a fully charged leap does on its hit ---------------
# One effector class of our own (BluntLeapImpactEffector, in the scripts). It
# runs for the player on every strong melee hit, at the stage where the crit
# is already known and the enemy has not picked its hit reaction yet.
# The script decides the rest (EMP on a crit, send flying or stagger).

BluntLeap.ImpactPrereq:
  $type: HitPrereq
  prereqClassName: HitTriggeredPrereq
  callbackType: HitTriggered
  pipelineStage: ProcessHitReaction
  pipelineType: Damage
  isSynchronous: true
  ignoreSelfInflictedPressureWave: true
  processMiss: false
  conditions:
    - Perks.IsHitStrongAttack_inline0
    - Perks.IsHitStrongAttack_inline1

BluntLeap.ImpactEffector:
  $type: Effector
  effectorClassName: BluntLeapImpactEffector
  prereqRecord: BluntLeap.ImpactPrereq

BluntLeap.Impact:
  $type: GameplayLogicPackage
  stackable: false
  effectors:
    - BluntLeap.ImpactEffector

# The EMP burst: the Yinglong explosion (same look, same EMP status), with its
# damage replaced by one Electrical value that the script sets before each
# burst, and with no damage to V. Radius and damage follow the settings.

BluntLeap.EMPDamage:
  $type: ConstantStatModifier
  statType: BaseStats.ElectricDamage
  modifierType: Additive
  value: 1.0

BluntLeap.EMP:
  $base: Attacks.YinglongEMP
  playerIncomingDamageMultiplier: 0.0
  range: 3.0
  # Enemies the blast damages ask the game for a stagger (strength 2); the
  # script lowers it to 1 when the setting "Stagger when not sent flying" is off.
  hitReactionSeverityMin: 2
  hitReactionSeverityMax: 2
  statModifiers:
    - BluntLeap.EMPDamage

# --- The two perks (made real by Perk Addition Framework) -------------------
# Record names must be NewPerks.<enumName>. Slots: the tier-2 bridge slot
# beside Breakthrough, and the centre column slot on its other side; both are
# empty on the Body page. The perks carry no effects of their own: the scripts
# read who owns them and apply the packages above.
# The Dash requirement is checked in script, not listed here: the perk screen
# cannot handle a required perk from another page.
# Both perks have their own icons (archive/pc/mod/BluntLeap.archive, built by
# tools/pack_icons.sh).
# The name and description keys are plain text keys (the perk screen passes
# them to GetLocalizedText); the texts are in BluntLeap_Texts.reds. The
# descriptions here are the default variants; BluntLeapSystem switches to
# another variant when a setting changes what the perk does.

# The two perk icons: two parts of our own small atlas.
UIIcon.BluntLeap_Leap:
  $type: UIIcon
  atlasResourcePath: bluntleap\gui\icons\blunt_leap_icons.inkatlas
  atlasPartName: blunt_leap

UIIcon.BluntLeap_Stronger:
  $type: UIIcon
  atlasResourcePath: bluntleap\gui\icons\blunt_leap_icons.inkatlas
  atlasPartName: stronger_leap

# The numbers shown in the descriptions ({float_0}, {float_1}). The scripts
# rewrite them from the settings.
NewPerks.BluntLeap_Leap_UI:
  $type: NewPerkLevelUIData
  floatValues: [ 50.0 ]

NewPerks.BluntLeap_Stronger_UI:
  $type: NewPerkLevelUIData
  floatValues: [ 50.0, 80.0, 30.0 ]

NewPerks.BluntLeap_Leap:
  $type: NewPerk
  enumName: BluntLeap_Leap
  enumComment: Blunt Leap mod, leap attack for blunt weapons
  loc_name_key: BluntLeap-Perk-Leap-Name
  loc_desc_key: BluntLeap-Perk-Leap-Desc-NAB
  perkIcon: UIIcon.BluntLeap_Leap
  binkPath: bluntleap\movies\perk_body_batteringram.bk2
  category: NewPerks.SimpleNewPerkCategory
  perkWeaponGroup: NewPerks.BluntsPerkWeaponGroup
  slot: NewPerks.Inbetween_Right_2
  requiresPerks:
    - NewPerks.Body_Right_Perk_2_4
  tier: NewPerks.AdeptNewPerkTier
  attribute: NewPerks.BodyAttributeData
  uiData: NewPerks.BluntLeap_Leap_UI
  levels:
    - $type: NewPerkLevelData
      dataPackage:
        $type: GameplayLogicPackage

NewPerks.BluntLeap_Stronger:
  $type: NewPerk
  enumName: BluntLeap_Stronger
  enumComment: Blunt Leap mod, stronger fully charged leap
  loc_name_key: BluntLeap-Perk-Stronger-Name
  loc_desc_key: BluntLeap-Perk-Stronger-Desc-ES
  perkIcon: UIIcon.BluntLeap_Stronger
  binkPath: bluntleap\movies\perk_body_thunderbreaker.bk2
  category: NewPerks.SimpleNewPerkCategory
  perkWeaponGroup: NewPerks.BluntsPerkWeaponGroup
  slot: NewPerks.Central_Perk_2_3
  requiresPerks:
    - NewPerks.BluntLeap_Leap
  tier: NewPerks.AdeptNewPerkTier
  attribute: NewPerks.BodyAttributeData
  uiData: NewPerks.BluntLeap_Stronger_UI
  levels:
    - $type: NewPerkLevelData
      dataPackage:
        $type: GameplayLogicPackage

# The one change to a vanilla record: the Body page lists its perks here, so
# ours are added to the end of that list (other perk mods do the same).
NewPerks.BodyAttributeData:
  perks:
    - !append-once NewPerks.BluntLeap_Leap
    - !append-once NewPerks.BluntLeap_Stronger
